name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pruebas (sin audio, sin LLM real, sin capturas reales)
        run: python -m unittest discover -s tests < /dev/null
